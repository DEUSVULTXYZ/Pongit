# Add to compose.yaml while the V3 application stays online. No public ports.
services:
  hasura-v4-stage:
    image: hasura/graphql-engine:v2.48.6
    restart: unless-stopped
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://pong_indexer:${INDEXER_DB_PASSWORD}@postgres:5432/pong_indexer_v4_1ff69df6
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET}
      HASURA_GRAPHQL_ENABLE_CONSOLE: "false"
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  indexer-v4-stage:
    image: pongit-indexer-v4
    restart: unless-stopped
    environment:
      ENVIO_API_TOKEN: ${ENVIO_API_TOKEN:-}
      ENVIO_PG_HOST: postgres
      ENVIO_PG_PORT: 5432
      ENVIO_PG_USER: pong_indexer
      ENVIO_PG_PASSWORD: ${INDEXER_DB_PASSWORD}
      ENVIO_PG_DATABASE: pong_indexer_v4_1ff69df6
      ENVIO_PG_SCHEMA: indexer
      HASURA_GRAPHQL_ENDPOINT: http://hasura-v4-stage:8080/v1/metadata
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET}
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
