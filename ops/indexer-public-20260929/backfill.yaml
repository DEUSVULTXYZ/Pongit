name: pong
description: Authoritative Pong events, replay, ratings and integrity signals
handlers: src
field_selection:
  transaction_fields:
    - hash
contracts:
  - name: Game
    events:
      - event: MatchCreated(uint256 indexed matchId, address indexed playerA, address indexed playerB, uint256 tournamentId)
      - event: Snapshot(uint256 indexed matchId, uint64 version, bytes state, uint64 nextAt, uint8 nextKind, uint64 clock)
      - event: MatchEnded(uint256 indexed matchId, address indexed winner, uint8 status)
      - event: RatingUpdated(address indexed player, uint256 indexed season, uint32 elo, uint32 played, uint32 wins)
  - name: Market
    events:
      - event: BetPlaced(uint256 indexed matchId, address indexed player, uint8 side, uint256 shares, uint256 cost)
      - event: Claimed(uint256 indexed matchId, address indexed player, uint256 amount, bool refunded)
  - name: Tournaments
    events:
      - event: TournamentCreated(uint256 indexed tournamentId, uint64 closesAt, uint32 capacity, uint256 fee, uint256 prize)
      - event: Registered(uint256 indexed tournamentId, address indexed player)
      - event: BracketUpdated(uint256 indexed tournamentId, uint256 round, address[] bracket)
      - event: TournamentEnded(uint256 indexed tournamentId, address indexed winner, uint8 status, uint256 prize)
  - name: GameV2
    events:
      - event: MatchCreated(uint256 indexed matchId, address indexed playerA, address indexed playerB, uint256 tournamentId, uint8 mode, bool ranked, uint16 rulesVersion)
      - event: Snapshot(uint256 indexed matchId, uint64 version, bytes state, uint64 nextAt, uint8 nextKind, uint64 clock)
      - event: MatchEnded(uint256 indexed matchId, address indexed winner, uint8 status)
      - event: RatingUpdated(address indexed player, uint256 indexed season, uint8 indexed mode, uint32 elo, uint32 played, uint32 wins)
      - event: HandicapSet(uint256 indexed matchId, int256 halfA, int256 halfB, uint256 paidA, uint256 paidB, uint64 at)
  - name: MarketV2
    events:
      - event: BetPlaced(uint256 indexed matchId, address indexed player, uint8 side, uint256 shares, uint256 cost)
      - event: Claimed(uint256 indexed matchId, address indexed player, uint256 amount, bool refunded)
  - name: TournamentsV2
    events:
      - event: TournamentCreated(uint256 indexed tournamentId, uint64 closesAt, uint32 capacity, uint256 fee, uint256 prize)
      - event: Registered(uint256 indexed tournamentId, address indexed player)
      - event: BracketUpdated(uint256 indexed tournamentId, uint256 round, address[] bracket)
      - event: TournamentEnded(uint256 indexed tournamentId, address indexed winner, uint8 status, uint256 prize)
  - name: GameV3
    events:
      - event: MatchCreated(uint256 indexed matchId, address indexed playerA, address indexed playerB, uint256 tournamentId, uint8 mode, bool ranked, uint16 rulesVersion)
      - event: Snapshot(uint256 indexed matchId, uint64 version, bytes state, uint64 nextAt, uint8 nextKind, uint64 clock)
      - event: MatchEnded(uint256 indexed matchId, address indexed winner, uint8 status)
      - event: RatingUpdated(address indexed player, uint256 indexed season, uint8 indexed mode, uint32 elo, uint32 played, uint32 wins)
      - event: HandicapSet(uint256 indexed matchId, int256 halfA, int256 halfB, uint256 paidA, uint256 paidB, uint64 at)
  - name: MarketV3
    events:
      - event: BetPlaced(uint256 indexed matchId, address indexed player, uint8 side, uint256 shares, uint256 cost)
      - event: Claimed(uint256 indexed matchId, address indexed player, uint256 amount, bool refunded)
  - name: TournamentsV3
    events:
      - event: TournamentCreated(uint256 indexed tournamentId, uint64 closesAt, uint32 capacity, uint256 fee, uint256 prize)
      - event: Registered(uint256 indexed tournamentId, address indexed player)
      - event: BracketUpdated(uint256 indexed tournamentId, uint256 round, address[] bracket)
      - event: TournamentEnded(uint256 indexed tournamentId, address indexed winner, uint8 status, uint256 prize)
  - name: GameV4
    events:
      - event: MatchCreated(uint256 indexed matchId, address indexed playerA, address indexed playerB, uint256 tournamentId, uint8 mode, bool ranked, uint16 rulesVersion)
      - event: Snapshot(uint256 indexed matchId, uint64 version, bytes state, uint64 nextAt, uint8 nextKind, uint64 clock)
      - event: MatchEnded(uint256 indexed matchId, address indexed winner, uint8 status)
      - event: RatingUpdated(address indexed player, uint256 indexed season, uint8 indexed mode, uint32 elo, uint32 played, uint32 wins)
      - event: HandicapSet(uint256 indexed matchId, int256 halfA, int256 halfB, uint256 paidA, uint256 paidB, uint64 at)
  - name: MarketV4
    events:
      - event: BetPlaced(uint256 indexed matchId, address indexed player, uint8 side, uint256 shares, uint256 cost)
      - event: Claimed(uint256 indexed matchId, address indexed player, uint256 amount, bool refunded)
      - event: PayoutCreated(bytes32 indexed payoutId, uint256 indexed sourceId, address indexed recipient, uint8 kind, uint256 amount)
      - event: PayoutPaid(bytes32 indexed payoutId, address indexed recipient, uint256 amount)
      - event: PayoutDeferred(bytes32 indexed payoutId, address indexed recipient, uint256 amount, uint32 attempts)
  - name: TournamentsV4
    events:
      - event: TournamentCreated(uint256 indexed tournamentId, uint64 closesAt, uint32 capacity, uint256 fee, uint256 prize)
      - event: Registered(uint256 indexed tournamentId, address indexed player)
      - event: BracketUpdated(uint256 indexed tournamentId, uint256 round, address[] bracket)
      - event: TournamentEnded(uint256 indexed tournamentId, address indexed winner, uint8 status, uint256 prize)
      - event: PayoutCreated(bytes32 indexed payoutId, uint256 indexed sourceId, address indexed recipient, uint8 kind, uint256 amount)
      - event: PayoutPaid(bytes32 indexed payoutId, address indexed recipient, uint256 amount)
      - event: PayoutDeferred(bytes32 indexed payoutId, address indexed recipient, uint256 amount, uint32 attempts)

  - name: IndependentRatings
    events:
      - event: ResultPublished(uint256 indexed id, address indexed arena, uint256 epoch, bytes32 hash, uint256 index)
      - event: ResultCorrected(uint256 indexed id, bytes32 previousHash, bytes32 correctedHash, uint256 revision)
      - event: ResultFinal(uint256 indexed id, bytes32 hash)

  - name: ChaosEventsArchive
    events:
      - event: MatchRecorded(uint256 indexed id, uint256 indexed epoch, address indexed app, bytes32 hash, address a, address b, address winner, uint8 status, uint8 mode, bool ranked, uint8 scoreA, uint8 scoreB, bool played, uint64 finishedAt)
  - name: AgentArchive
    events:
      - event: MatchRecorded(uint256 indexed id, uint256 indexed epoch, address indexed app, bytes32 hash, address a, address b, address winner, uint8 status, uint8 mode, bool ranked, uint8 scoreA, uint8 scoreB, bool played, uint64 finishedAt)
  - name: AgentSeriesArchive
    events:
      - event: SeriesResultRecorded(uint256 indexed id, uint256 indexed epoch, address indexed app, bytes32 hash, address a, address b, address winner, uint8 status, uint8 mode, bool ranked, uint8 scoreA, uint8 scoreB, uint64 elapsedUs, uint64 tournament, bool finality)

  - name: CurrentIndependentRatings
    events:
      - event: ResultPublished(uint256 indexed id, address indexed arena, uint256 epoch, bytes32 hash, uint256 index)
      - event: ResultCorrected(uint256 indexed id, bytes32 previousHash, bytes32 correctedHash, uint256 revision)
      - event: ResultFinal(uint256 indexed id, bytes32 hash)

  - name: AgentReusableFiveArchive
    events:
      - event: SeriesResultRecorded(uint256 indexed id, uint256 indexed epoch, address indexed app, bytes32 hash, address a, address b, address winner, uint8 status, uint8 mode, bool ranked, uint8 scoreA, uint8 scoreB, uint64 elapsedUs, uint64 tournament, bool finality)

