[profile.default]
src = "src"
out = "out"
libs = ["lib", "../node_modules"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = ["@openzeppelin/=../node_modules/@openzeppelin/", "@prb/math/=../node_modules/@prb/math/"]

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 128
depth = 128
